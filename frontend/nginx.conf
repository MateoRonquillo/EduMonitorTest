server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'Healthy';
    }

    location /moodle/ {
        proxy_pass http://moodle/;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Forwarded-Host localhost:8080;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /access/ {
        proxy_pass http://access:8080/;
        proxy_set_header Host $host;
    }

    location /integration/ {
        proxy_pass http://moodle-integration:8080/;
        proxy_set_header Host $host;
    }

    location /academic/ {
        proxy_pass http://academic-data:8080/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
