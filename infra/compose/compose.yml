name: edumonitorai
services:
  academic-db:
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurar MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: academic
      MYSQL_USER: edumonitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configurar MYSQL_PASSWORD}
    volumes:
      - academic_data:/var/lib/mysql
      - ../mysql/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u edumonitor -D academic -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
  moodle-db:
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configurar MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD:?Configurar MOODLE_DB_PASSWORD}
    volumes: [moodle_db:/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u moodle -D moodle -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
  moodle:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Moodle.Dockerfile
    ports: ['127.0.0.1:8080:80']
    environment:
      MOODLE_WWWROOT: http://localhost:8080
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?Configurar MOODLE_ADMIN_PASSWORD}
      MOODLE_LAB_PASSWORD: ${MOODLE_LAB_PASSWORD:?Configurar MOODLE_LAB_PASSWORD}
      MOODLE_TEACHER_PASSWORD: ${MOODLE_TEACHER_PASSWORD:-Docente123!}
      MOODLE_STUDENT_PASSWORD: ${MOODLE_STUDENT_PASSWORD:-Estudiante123!}
    healthcheck:
      test: [CMD-SHELL, "test -f /var/www/moodledata/.edumonitor-ready && curl --fail --silent --header 'Host: localhost:8080' http://127.0.0.1/health.php | grep -qx Healthy"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 20
    volumes: [moodle_data:/var/www/moodledata, moodle_config:/var/www/html/config-volume]
    networks: [backend]
    depends_on:
      moodle-db: {condition: service_healthy}
  moodle-integration:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/MoodleIntegration.Dockerfile
    ports: ['127.0.0.1:5101:8080']
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Moodle__BaseUrl: http://moodle
      Moodle__AllowHttp: 'true'
      Moodle__HostHeader: localhost:8080
    networks: [backend]
    depends_on:
      moodle: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
  academic-data:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/AcademicData.Dockerfile
    ports: ['127.0.0.1:5102:8080']
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Moodle__BaseUrl: http://moodle
      Moodle__AllowHttp: 'true'
      Moodle__HostHeader: localhost:8080
      Services__MoodleIntegration: http://moodle-integration:8080
      Database__Host: academic-db
      Database__Password: ${MYSQL_PASSWORD}
    networks: [backend]
    depends_on:
      academic-db: {condition: service_healthy}
      moodle-integration: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
  access:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Access.Dockerfile
    ports: ['127.0.0.1:5103:8080']
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Moodle__BaseUrl: http://moodle
      Moodle__AllowHttp: 'true'
      Moodle__HostHeader: localhost:8080
    networks: [backend]
    depends_on:
      moodle: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:5170:80']
    networks: [backend]
    depends_on:
      access: {condition: service_healthy}
      moodle-integration: {condition: service_healthy}
      academic-data: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/health]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  academic_data:
  moodle_db:
  moodle_data:
  moodle_config:
networks:
  backend:
